name: tests

on:
  push:
    branches: [ principal ]
  pull_request:
    branches: [ principal ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Upgrade pip
        run: python -m pip install -U pip

      # Proyecto 1 (API SQLite)
      - name: Install deps P1
        run: |
          pip install -r 01_api_sqlite/requirements.txt
      - name: Run tests P1
        working-directory: 01_api_sqlite
        env:
          PYTHONPATH: .
        run: pytest -q

      # Proyecto 2 (NLP)
      - name: Install deps P2
        run: |
          pip install -r 02_nlp_fastapi/requirements.txt
      - name: Download NLTK data (P2)
        run: |
          python - <<'PY'
          import nltk
          nltk.download("punkt", quiet=True)
          nltk.download("stopwords", quiet=True)
          PY
      - name: Run tests P2
        working-directory: 02_nlp_fastapi
        env:
          PYTHONPATH: .
        run: pytest -q
